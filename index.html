    // --- RANDOM SAMPLING UTILITY FUNCTION ---
    // Randomly selects 30 questions evenly from 4 dimensions (7-8 from each)
    const generateRandomQuiz = () => {
      const getAxisRandom = (axis, count) => {
        const filtered = QUESTION_BANK.filter(q => q.axis === axis);
        const shuffled = [...filtered].sort(() => 0.5 - Math.random());
        return shuffled.slice(0, count);
      };

      const ei = getAxisRandom('EI', 8);
      const sn = getAxisRandom('SN', 7);
      const tf = getAxisRandom('TF', 8);
      const jp = getAxisRandom('JP', 7);

      const combined = [...ei, ...sn, ...tf, ...jp];
      return combined.sort(() => 0.5 - Math.random()); // Shuffle overall quiz order
    };

        const randomQuiz = generateRandomQuiz();
        setActiveQuestions(randomQuiz);
        setAnswers({});
        setCurrentQuestionIndex(0);
        setCurrentView('quiz');
      };

      const handleSelectOption = (optionScore) => {
        const currentQ = activeQuestions[currentQuestionIndex];
        setAnswers(prev => ({
          ...prev,
          [currentQ.id]: optionScore
        }));
      };

      const handleNextQuestion = () => {
        if (!answers[activeQuestions[currentQuestionIndex].id]) return;

        if (currentQuestionIndex < activeQuestions.length - 1) {
          setAnimating(true);
          setTimeout(() => {
            setCurrentQuestionIndex(prev => prev + 1);
            setAnimating(false);
          }, 150);
        } else {
          calculateMBTI();
        }
      };

      const handlePrevQuestion = () => {
        if (currentQuestionIndex > 0) {
          setAnimating(true);
          setTimeout(() => {
            setCurrentQuestionIndex(prev => prev - 1);
            setAnimating(false);
          }, 150);
        }
      };

      const calculateMBTI = () => {
        const scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
        
        Object.values(answers).forEach(val => {
          // Normalize score string if it contains extra tailwind classes
          const cleanScore = val.trim().charAt(0);
          if (scores[cleanScore] !== undefined) {
            scores[cleanScore]++;
          }
        });

        const eCount = scores.E + scores.I || 1;
        const sCount = scores.S + scores.N || 1;
        const tCount = scores.T + scores.F || 1;
        const jCount = scores.J + scores.P || 1;

        const ePct = Math.round((scores.E / eCount) * 100);
        const iPct = 100 - ePct;

        const sPct = Math.round((scores.S / sCount) * 100);
        const nPct = 100 - sPct;

        const tPct = Math.round((scores.T / tCount) * 100);
        const fPct = 100 - tPct;

        const jPct = Math.round((scores.J / jCount) * 100);
        const pPct = 100 - jPct;

        const resCode = `${ePct >= 50 ? 'E' : 'I'}${sPct >= 50 ? 'S' : 'N'}${tPct >= 50 ? 'T' : 'F'}${jPct >= 50 ? 'J' : 'P'}`;

        setResultData({
          code: resCode,
          percentages: {
            E: ePct, I: iPct,
            S: sPct, N: nPct,
            T: tPct, F: fPct,
            J: jPct, P: pPct
          },
          details: PERSONALITIES[resCode] || PERSONALITIES.INTJ
        });

                    <li key={i} className="flex items-start gap-2">
                      <span className="text-rose-500 font-bold">•</span>
                      <span>{w}</span>
                    </li>
                  ))}
                </ul>
              </div>
            </div>
          </div>

          {/* Section 2: Career Advice */}
          <div className="clay-card p-6 sm:p-8 shadow-cartoon-sm space-y-5">
            <h3 className="text-xl font-black text-slate-800 border-b border-slate-200/60 pb-3">
              💼 2. 适配职业与工作环境
            </h3>

            <div className="space-y-4">
              <div>
                <h4 className="text-xs font-black text-slate-400 uppercase tracking-wider mb-2.5">适配岗位建议</h4>
                <div className="flex flex-wrap gap-2">
                  {details.careers.map((c, i) => (
                    <span key={i} className="px-3.5 py-2 rounded-2xl bg-white border border-slate-200 text-slate-800 text-xs sm:text-sm font-bold shadow-xs">
                      🎯 {c}
                    </span>
                  ))}
                </div>
              </div>

              <div>
                <h4 className="text-xs font-black text-slate-400 uppercase tracking-wider mb-1.5">最佳工作氛围</h4>
                <p className="text-sm text-slate-700 bg-white/60 p-4 rounded-2xl border border-slate-200/60 font-medium leading-relaxed">
                  {details.environment}
                </p>
              </div>
            </div>
          </div>

          {/* Section 3: Relationship Advice */}
          <div className="clay-card p-6 sm:p-8 shadow-cartoon-sm space-y-5">
            <h3 className="text-xl font-black text-slate-800 border-b border-slate-200/60 pb-3">
              💖 3. 情感与人际相处指南
            </h3>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs sm:text-sm">
              <div className="p-4 rounded-2xl bg-purple-50/80 border border-purple-200/80 space-y-1">
                <span className="font-black text-purple-900">亲密关系优势：</span>
                <p className="text-slate-700 font-medium">{details.loveStrengths}</p>
              </div>
              <div className="p-4 rounded-2xl bg-amber-50/80 border border-amber-200/80 space-y-1">
                <span className="font-black text-amber-900">容易踩坑的分歧点：</span>
                <p className="text-slate-700 font-medium">{details.lovePitfalls}</p>
              </div>
            </div>

            <div className="p-4 rounded-2xl bg-indigo-50/80 border border-indigo-200/80 space-y-1 text-xs sm:text-sm">
              <span className="font-black text-indigo-950">💡 沟通相处建议：</span>
              <p className="text-slate-700 font-medium">{details.loveAdvice}</p>
            </div>

            <div className="flex items-center justify-between p-4 rounded-2xl bg-white border border-slate-200/80">
              <span className="text-xs sm:text-sm font-bold text-slate-700">契合度极佳的搭档参考：</span>
              <span className="text-xs sm:text-sm font-black text-violet-700 px-4 py-1.5 rounded-full bg-violet-100 border border-violet-200">
                {details.match}
              </span>
            </div>
          </div>

          {/* Action Buttons */}
          <div className="flex flex-col sm:flex-row items-center justify-center gap-4 pt-4">
            <button
              onClick={onRestart}
              className="w-full sm:w-auto px-10 py-4 rounded-3xl bg-violet-600 hover:bg-violet-700 text-white font-black text-base shadow-cartoon-btn active:shadow-cartoon-btn-active active:translate-y-1 transition-all"
            >
              换一批随机题重新测试
            </button>
            <button
              onClick={onViewGallery}
              className="w-full sm:w-auto px-8 py-4 rounded-3xl bg-white hover:bg-slate-50 text-slate-700 font-black text-base border-2 border-slate-200/80 shadow-cartoon-sm hover:-translate-y-0.5 transition-all"
            >
              浏览 16 人格图鉴
            </button>
          </div>
        </div>
      );
    }

    // --- VIEW 4: GALLERY PAGE ---
    function GalleryView({ onSelectCard }) {
      const groups = [
        { key: 'Analysts', name: '分析家 (Analysts)', color: 'border-purple-500 bg-purple-100/60 text-purple-800', list: ['INTJ', 'INTP', 'ENTJ', 'ENTP'] },
        { key: 'Diplomats', name: '外交家 (Diplomats)', color: 'border-emerald-500 bg-emerald-100/60 text-emerald-800', list: ['INFJ', 'INFP', 'ENFJ', 'ENFP'] },
        { key: 'Sentinels', name: '守护者 (Sentinels)', color: 'border-sky-500 bg-sky-100/60 text-sky-800', list: ['ISTJ', 'ISFJ', 'ESTJ', 'ESFJ'] },
        { key: 'Explorers', name: '探险家 (Explorers)', color: 'border-amber-500 bg-amber-100/60 text-amber-800', list: ['ISTP', 'ISFP', 'ESTP', 'ESFP'] }
      ];

      return (
        <div className="space-y-10 animate-fade-in">
          <div className="text-center space-y-3 max-w-2xl mx-auto">
            <h1 className="text-3xl font-black text-slate-800">16 人格全景图鉴</h1>
            <p className="text-sm font-medium text-slate-600">
              点击任意卡通人偶卡片，弹窗查看该性格的详细说明与倾向。
            </p>
          </div>

          <div className="space-y-8">
            {groups.map(group => (
              <div key={group.key} className="space-y-4">
                <div className="flex items-center gap-3">
                  <span className={`px-4 py-1.5 rounded-full text-xs font-black border ${group.color}`}>
                    {group.name}
                  </span>
                  <div className="flex-1 h-0.5 bg-slate-200/80"></div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                  {group.list.map(code => {
                    const item = PERSONALITIES[code];
                    return (
                      <div
                        key={code}
                        onClick={() => onSelectCard(item)}
                        className="clay-card p-5 shadow-cartoon-sm hover:shadow-cartoon-md hover:-translate-y-1.5 transition-all cursor-pointer flex flex-col items-center text-center space-y-3 group"
                      >
                        <LowPolyAvatar type={code} size="w-24 h-24" />

                        <div>
                          <span className="text-xs font-extrabold text-slate-400 block">{code}</span>
                          <h3 className="text-xl font-black text-slate-800 group-hover:text-violet-600 transition-colors">
                            {item.name}
                          </h3>
                        </div>

                        <p className="text-xs text-slate-500 font-medium line-clamp-2 leading-relaxed">
                          {item.title}
                        </p>

                        <span className="text-xs font-bold text-violet-600 group-hover:underline pt-1">
                          点击查看详情 →
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- PERSONALITY POPUP MODAL ---
    function PersonalityModal({ personality, onClose }) {
      if (!personality) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs animate-fade-in">
          <div 
            className="clay-card bg-white/95 rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl border border-white max-h-[90vh] overflow-y-auto custom-scrollbar space-y-6 relative"
            onClick={(e) => e.stopPropagation()}
          >
            <button
              onClick={onClose}
              className="absolute top-5 right-5 w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold flex items-center justify-center transition-colors"
            >
              ✕
            </button>

            <div className="flex flex-col sm:flex-row items-center gap-5 text-center sm:text-left">
              <LowPolyAvatar type={personality.code} size="w-28 h-28" />
              <div>
                <span className={`text-xs font-black px-3 py-1 rounded-full border ${personality.badgeColor}`}>
                  {personality.groupName}
                </span>
                <h2 className="text-3xl font-black text-slate-800 mt-2">
                  {personality.code} - {personality.name}
                </h2>
                <p className="text-xs font-bold text-slate-500 mt-1">{personality.title}</p>
              </div>
            </div>

            <p className="text-xs sm:text-sm text-slate-600 leading-relaxed bg-slate-50 p-4 rounded-2xl border border-slate-100 font-medium">
              {personality.desc}
            </p>

            <div className="space-y-2">
              <h4 className="text-xs font-black text-slate-400 uppercase tracking-wider">核心特质</h4>
              <div className="flex flex-wrap gap-2">
                {personality.traits.map((t, idx) => (
                  <span key={idx} className="px-3 py-1 rounded-xl bg-violet-100 text-violet-800 text-xs font-black">
                    #{t}
                  </span>
                ))}
              </div>
            </div>

            <div className="space-y-2">
              <h4 className="text-xs font-black text-slate-400 uppercase tracking-wider">推荐适配职业</h4>
              <div className="flex flex-wrap gap-1.5">
                {personality.careers.map((c, idx) => (
                  <span key={idx} className="px-3 py-1 rounded-lg bg-slate-100 text-slate-700 text-xs font-bold">
                    {c}
                  </span>
                ))}
              </div>
            </div>

            <div className="pt-2">
              <button
                onClick={onClose}
                className="w-full py-3.5 rounded-2xl bg-violet-600 hover:bg-violet-700 text-white font-black text-sm shadow-cartoon-sm transition-all"
              >
                关闭卡片
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Render Root
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
